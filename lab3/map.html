<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Музеї та театри Львова — карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>html,body,#map{height:100%;margin:0}body{font:14px system-ui,sans-serif}.map-title{position:absolute;z-index:900;top:10px;left:50px;background:#fff;padding:8px 12px;border-radius:10px;box-shadow:0 2px 10px #0002;font-weight:700}.leaflet-popup-content{line-height:1.5}.leaflet-control-layers{max-width:220px}</style>
</head>
<body>
  <div class="map-title">Львів · варіант 2</div>
  <div id="map" role="application" aria-label="Карта музеїв і театрів Львова"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Координати 10 туристичних об'єктів у центральній частині Львова.
    const places = {
      museums: [
        [49.84245,24.03125,"Львівський історичний музей — площа Ринок, 6"],
        [49.84268,24.03362,"Аптека-музей — вулиця Друкарська, 2"],
        [49.84225,24.02773,"Національний музей імені Андрея Шептицького — проспект Свободи, 20"],
        [49.84115,24.02834,"Музей етнографії та художнього промислу — проспект Свободи, 15"],
        [49.83567,24.02734,"Львівська національна галерея мистецтв — вулиця Стефаника, 3"]
      ],
      theaters: [
        [49.84470,24.02638,"Львівський національний академічний театр опери та балету — проспект Свободи, 28"],
        [49.84542,24.02364,"Театр імені Марії Заньковецької — вулиця Лесі Українки, 1"],
        [49.84383,24.02742,"Театр імені Леся Курбаса — вулиця Леся Курбаса, 3"],
        [49.84315,24.03207,"Львівський академічний театр ляльок — площа Данила Галицького, 1"],
        [49.84113,24.02722,"Перший український театр для дітей та юнацтва — вулиця Гнатюка, 11"]
      ]
    };
    const map = L.map('map').setView([49.8417,24.0295],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    function buildLayer(items,kind){
      const layer=L.layerGroup();
      items.forEach(([lat,lng,name])=>{
        const query=encodeURIComponent(name);
        L.marker([lat,lng]).bindPopup(`<strong>${name}</strong><br><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${query}">Відкрити у Google Maps</a>`).addTo(layer);
      });
      return layer;
    }
    const museums=buildLayer(places.museums,'museum').addTo(map);
    const theaters=buildLayer(places.theaters,'theater').addTo(map);
    L.control.layers(null,{'Музеї (5)':museums,'Театри (5)':theaters},{collapsed:false}).addTo(map);
  </script>
</body>
</html>
